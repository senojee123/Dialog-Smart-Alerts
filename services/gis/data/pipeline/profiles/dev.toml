properties = { level = 3 }
parent_by = "location"
accuracy_m = 100
qa = { expected_area = "national", min_features = 300, max_features = 360, min_coverage_ratio = 0.8 }

[[datasets]]
name = "admin-l4-gn-divisions-pilot"
layer = "ref.admin_area"
source = "geoboundaries-lka-adm4"
adapter = "vector"
area = "pilot"
select = "representative_point"
id_field = "shapeID"
id_prefix = "gb-"
fields = { name = "shapeName", code = "shapeID" }
properties = { level = 4 }
parent_by = "location"
accuracy_m = 50
qa = { expected_area = "national", min_features = 100, max_area_m2 = 500000000 }

[[datasets]]
name = "settlements-towns"
