# --- datasets ----------------------------------------------------------------------------------------------

[[datasets]]
name = "admin-l0-country"
layer = "ref.admin_area"
source = "geoboundaries-lka-adm0"
adapter = "vector"
id_field = "shapeID"
id_prefix = "gb-"
fields = { name = "shapeName", code = "shapeISO" }
properties = { level = 0 }
accuracy_m = 100
qa = { expected_area = "national", min_features = 1, max_features = 1 }

[[datasets]]
name = "admin-l1-provinces"
layer = "ref.admin_area"
source = "geoboundaries-lka-adm1"
adapter = "vector"
id_field = "shapeID"
id_prefix = "gb-"
fields = { name = "shapeName", code = "shapeISO" }
properties = { level = 1 }
accuracy_m = 100
qa = { expected_area = "national", min_features = 9, max_features = 9, code_pattern = "^LK-[1-9]$" }

[[datasets]]
name = "admin-l2-districts"
layer = "ref.admin_area"
source = "geoboundaries-lka-adm2"
adapter = "vector"
id_field = "shapeID"
id_prefix = "gb-"
fields = { name = "shapeName", code = "shapeISO" }
properties = { level = 2 }
parent_by = "location"
accuracy_m = 100
qa = { expected_area = "national", min_features = 25, max_features = 25, code_pattern = "^LK-[1-9][0-9]$" }

[[datasets]]
name = "admin-l3-ds-divisions"
layer = "ref.admin_area"
source = "geoboundaries-lka-adm3"
adapter = "vector"
id_field = "shapeID"
id_prefix = "gb-"
