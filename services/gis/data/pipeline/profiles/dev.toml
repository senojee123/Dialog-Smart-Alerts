# Development profile: a reference data release that lets the whole GIS application run locally.
#
#   cd backend
#   python -m app.pipeline build --profile ../data/pipeline/profiles/dev.toml
#
# Openly licensed data only, with its licence stated for every source (nothing is assumed):
#
#   * administrative boundaries: geoBoundaries gbOpen (ADM0-ADM2 from OpenStreetMap, ODbL; ADM3-ADM4 from
#     OCHA ROAP and the Survey Department of Sri Lanka, CC BY 3.0 IGO)
#   * settlements, facilities, roads, rivers and water bodies, protected areas, basemap: OpenStreetMap
#     (Geofabrik extract), ODbL
#   * risk zones: labelled development placeholders (CC0) - there is no open source for Sri Lanka
#
# National coverage for the main layers; full detail (GN divisions, villages, local roads, streams, small
# tanks, schools) in the pilot area around Habarana, Dambulla, Sigiriya, Minneriya and Polonnaruwa.
#
# Licence reviews are "unreviewed": this is a development release. WDPA is not used (its licence forbids
# commercial use and redistribution without written permission from UNEP-WCMC). Production profiles name
# agency datasets and carry approved reviews; see production.example.toml.

[profile]
name = "dev"
purpose = "development"
release = "ref-{year}.{month}-dev"
description = "Development sample: geoBoundaries and OpenStreetMap (open data) with labelled placeholder risk zones; not for operational use"

[areas]
national = [79.44, 5.66, 82.15, 10.08]
pilot = [80.45, 7.75, 81.10, 8.30]

