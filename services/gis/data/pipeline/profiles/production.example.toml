# --- datasets ----------------------------------------------------------------------------------------------
# The field mappings are examples; match them to the delivered schema (ogrinfo -so <file> <layer>).

[[datasets]]
name = "admin-l1-provinces"
layer = "ref.admin_area"
source = "survey-dept-admin"
adapter = "vector"
input_layer = "provinces"
id_field = "PROV_CODE"
fields = { name = "PROV_NAME", code = "PROV_CODE" }
properties = { level = 1 }
accuracy_m = 10
qa = { expected_area = "national", min_features = 9, max_features = 9 }

[[datasets]]
name = "admin-l2-districts"
layer = "ref.admin_area"
source = "survey-dept-admin"
adapter = "vector"
input_layer = "districts"
id_field = "DIST_CODE"
fields = { name = "DIST_NAME", code = "DIST_CODE" }
properties = { level = 2 }
parent_by = "location"
accuracy_m = 10
qa = { expected_area = "national", min_features = 25, max_features = 25 }

[[datasets]]
name = "admin-l3-ds-divisions"
layer = "ref.admin_area"
source = "survey-dept-admin"
adapter = "vector"
input_layer = "ds_divisions"
id_field = "DSD_CODE"
fields = { name = "DSD_NAME", code = "DSD_CODE" }
properties = { level = 3 }
parent_by = "location"
accuracy_m = 10
qa = { expected_area = "national", min_features = 330 }

[[datasets]]
name = "admin-l4-gn-divisions"
layer = "ref.admin_area"
source = "survey-dept-admin"
adapter = "vector"
input_layer = "gn_divisions"
id_field = "GND_CODE"
fields = { name = "GND_NAME", code = "GND_CODE" }
properties = { level = 4 }
parent_by = "location"
accuracy_m = 10
qa = { expected_area = "national", min_features = 14000 }

[[datasets]]
name = "settlements"
layer = "ref.settlement"
source = "dcs-settlements"
adapter = "vector"
id_field = "SETTLE_ID"
fields = { name = "NAME", settlement_type = "TYPE", population = "POP" }
values = { settlement_type = { "Municipal Council" = "city", "Urban Council" = "town", "Village" = "village", "Estate" = "estate" } }
admin_area_by = "location"
accuracy_m = 50
qa = { expected_area = "national" }

[[datasets]]
name = "facilities"
layer = "ref.facility"
source = "moh-facilities"
adapter = "vector"
id_field = "FACILITY_ID"
fields = { name = "NAME", facility_type = "CATEGORY" }
values = { facility_type = { "Hospital" = "hospital", "Police" = "police_station", "Fire" = "fire_station" } }
admin_area_by = "location"
accuracy_m = 20
qa = { expected_area = "national" }

[[datasets]]
name = "roads-national"
layer = "ref.road"
source = "rda-roads"
adapter = "vector"
id_field = "ROAD_ID"
fields = { name = "ROAD_NAME", road_class = "CLASS", ref_code = "ROUTE_NO" }
accuracy_m = 10
qa = { expected_area = "national", min_coverage_ratio = 0.8 }

[[datasets]]
name = "protected-areas"
layer = "ref.protected_area"
source = "dwc-protected-areas"
adapter = "vector"
id_field = "PA_ID"
fields = { name = "PA_NAME", designation = "DESIGNATION" }
properties = { managing_authority = "DWC" }
accuracy_m = 20
qa = { expected_area = "national" }

[[datasets]]
name = "water-bodies"
layer = "ref.water_body"
source = "irrigation-water"
adapter = "vector"
id_field = "WATER_ID"
fields = { name = "NAME", water_type = "TYPE" }
values = { water_type = { "Tank" = "tank", "Reservoir" = "reservoir", "River" = "river", "Canal" = "canal" } }
accuracy_m = 20
qa = { expected_area = "national" }

[[datasets]]
name = "risk-zones"
layer = "ref.risk_zone"
source = "nbro-dmc-hazard-zones"
adapter = "vector"
id_field = "ZONE_ID"
fields = { name = "ZONE_NAME", risk_type = "HAZARD", severity = "LEVEL" }
values = { risk_type = { "Landslide" = "landslide", "Flood" = "flood", "Elephant corridor" = "elephant_corridor" } }
accuracy_m = 50
qa = { expected_area = "national" }

# --- basemap -----------------------------------------------------------------------------------------------

[basemap]
name = "lka"
osm_source = "osm-geofabrik-lka"
land_source = "geoboundaries-lka-adm0"
glyphs_source = "protomaps-basemaps-assets"
detail_area = "national"
min_zoom = 0
max_zoom = 14
public_path = "/basemap"
