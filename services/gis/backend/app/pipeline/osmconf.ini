#
# GDAL OSM driver configuration for the GIS Core Service reference data pipeline.
#
# Only the tags the pipeline maps (settlements, facilities, roads, water, protected areas and the basemap)
# become columns; everything else is kept as JSON in other_tags. Buildings are not turned into polygons:
# the pipeline does not use them, and there are millions of them in Sri Lanka.
#

# Closed ways with one of these keys are areas (multipolygons layer); other closed ways are lines.
closed_ways_are_polygons=amenity,boundary,healthcare,landuse,leisure,natural,office,place,water,wetland,protected_area

# Nodes and ways without significant tags are not reported.
report_all_nodes=no
report_all_ways=no

# other_tags as JSON (GDAL >= 3.7) rather than HSTORE text.
tags_format=json

[points]
osm_id=yes
osm_version=no
osm_timestamp=no
osm_uid=no
osm_user=no
osm_changeset=no
attributes=name,name:en,name:si,name:ta,place,population,population:date,capital,amenity,healthcare,emergency,office,government,operator,admin_level,wikidata
unsignificant=created_by,converted_by,source,time,ele,attribution
ignore=created_by,converted_by,source,time,ele,note,todo,fixme,FIXME

[lines]
osm_id=yes
osm_version=no
osm_timestamp=no
osm_uid=no
osm_user=no
osm_changeset=no
attributes=name,name:en,name:si,name:ta,highway,ref,waterway,intermittent,railway,tunnel,bridge,layer,surface
ignore=created_by,converted_by,source,time,ele,note,todo,fixme,FIXME

[multipolygons]
osm_id=yes
osm_version=no
osm_timestamp=no
osm_uid=no
osm_user=no
osm_changeset=no
attributes=name,name:en,name:si,name:ta,type,amenity,healthcare,office,government,operator,boundary,protect_class,protection_title,designation,iucn_level,leisure,natural,water,wetland,landuse,place,admin_level,wikidata
ignore=area,created_by,converted_by,source,time,ele,note,todo,fixme,FIXME

[multilinestrings]
osm_id=yes
osm_version=no
osm_timestamp=no
osm_uid=no
osm_user=no
osm_changeset=no
attributes=name,type
ignore=area,created_by,converted_by,source,time,ele,note,todo,fixme,FIXME

[other_relations]
osm_id=yes
osm_version=no
osm_timestamp=no
osm_uid=no
osm_user=no
osm_changeset=no
attributes=name,type
ignore=area,created_by,converted_by,source,time,ele,note,todo,fixme,FIXME
