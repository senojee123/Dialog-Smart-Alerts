[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gis-core-service"
version = "0.1.0"
description = "GIS Core Service: authoritative PostGIS spatial store, geo-context enrichment and spatial query APIs for Sri Lankan event intelligence."
requires-python = ">=3.13,<3.14"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.141.1,<1",
    "uvicorn[standard]>=0.53,<1",
    "sqlalchemy[asyncio]>=2.0.53,<2.1",
    "geoalchemy2>=0.20,<0.21",
    "alembic>=1.20,<2",
    "asyncpg>=0.31,<0.32",
    "shapely>=2.1.2,<3",
    "pyproj>=3.8,<4",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.15,<3",
    "prometheus-client>=0.26,<1",
]

[project.optional-dependencies]
# Reference data pipeline (python -m app.pipeline): also needs GDAL >= 3.8 command-line tools (gdal-bin).
pipeline = [
    "geopandas>=1.1.4,<2",
    "pyogrio>=0.13,<0.14",
    "pandas>=3.0.6,<4",
]
dev = [
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
    "httpx>=0.28.1,<1",
    "asgi-lifespan>=2.1,<3",
    "ruff>=0.16,<0.17",
    "mypy>=2.3,<3",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.pipeline" = ["osmconf.ini"]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: needs a PostgreSQL + PostGIS database (see tests/integration/conftest.py)",
    "pipeline: needs the pipeline extra and GDAL command-line tools (see tests/pipeline/conftest.py)",
]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "SIM", "PT", "N"]
ignore = [
    "S101",   # assert is fine in tests (scoped below) and type-narrowing
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["shapely.*", "asgi_lifespan.*", "geoalchemy2.*", "geopandas.*", "pyogrio.*", "pmtiles.*", "pandas.*"]
ignore_missing_imports = true
