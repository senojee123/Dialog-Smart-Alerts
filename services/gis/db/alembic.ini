# Alembic configuration for the GIS Core Service.
#
# Run from the repository root:   alembic -c db/alembic.ini upgrade head
# Connection details are NOT stored here; db/migrations/env.py builds the URL from GIS_DB_* environment
# variables and connects as the migration login (GIS_DB_MIGRATOR_USER).

[alembic]
script_location = %(here)s/migrations
# One path per line (paths may contain spaces): the application package, and this directory so that
# revisions can import migrations/migration_support.py.
prepend_sys_path =
    %(here)s/../backend
    %(here)s/migrations
path_separator = newline
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
truncate_slug_length = 40
timezone = UTC
revision_environment = false

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
